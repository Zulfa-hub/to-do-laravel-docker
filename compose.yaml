services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - storage_data:/var/www/html/storage
      - app_public:/var/www/html/public
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8090}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-todo_db}
      - DB_USERNAME=${DB_USERNAME:-todo_user}
      - DB_PASSWORD=${DB_PASSWORD:-todo_pass}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo_network

  webserver:
    image: nginx:1.27-alpine
    container_name: todo_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - todo_network

  db:
    image: mysql:8.4
    container_name: todo_db
    restart: unless-stopped
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-todo_db}
      - MYSQL_USER=${DB_USERNAME:-todo_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-todo_pass}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - todo_network

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: todo_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8091}:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3307
      - PMA_USER=${DB_USERNAME:-todo_user}
      - PMA_PASSWORD=${DB_PASSWORD:-todo_pass}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo_network

volumes:
  db_data:
  storage_data:
  app_public:

networks:
  todo_network:
    driver: bridge
